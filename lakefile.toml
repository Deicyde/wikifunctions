name = "wikifunctions"
defaultTargets = ["Wikifunctions"]

# Pinned to an upstream leanprover-community/mathlib4 commit (Lean v4.32.0-rc1).
# Bump `rev` (and lean-toolchain to match) to move; `lake exe cache get` pulls
# prebuilt oleans for the pinned commit.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "6eb4a1ce07e071ac0f8365e6999a3135b45d8ae4"

# Build every submodule. There is deliberately no root `Wikifunctions.lean`
# importing the closure: each proof file (e.g. Z13701.lean) restates its
# program alongside the Mathlib-free `*Prog.lean` twin, so importing both
# would collide; modules build independently.
[[lean_lib]]
name = "Wikifunctions"
globs = ["Wikifunctions.+"]

# Native executable for the differential test (Mathlib-free: imports only
# Wikifunctions.Python.Z13701Prog). Compiled so it runs fast even under heavy
# system load, unlike interpreted `lean --run`.
[[lean_exe]]
name = "diffdriver"
root = "DiffDriver"
