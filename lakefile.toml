name = "wikifunctions"
defaultTargets = ["Wikifunctions"]

# No dependencies: the ground-up model (ZObject + generated types) is Mathlib-free.
# Mathlib will be re-added when the evaluator's proofs connect to Mathlib oracles.

# The ground-up model: the hand-written `Wikifunctions.Model.ZObject` substrate and
# the generated `Wikifunctions.Model.Types.*` modules. Built via the glob.
[[lean_lib]]
name = "Wikifunctions"
globs = ["Wikifunctions.+"]
