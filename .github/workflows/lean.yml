name: Lean build and audit

on:
  push:
    branches: [main]
    paths:
      - 'Wikifunctions.lean'
      - 'Wikifunctions/**'
      - 'lakefile.toml'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'Wikifunctions.lean'
      - 'Wikifunctions/**'
      - 'lakefile.toml'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Lean and dependency caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned dependencies and Mathlib cache
        run: |
          lake update
          lake exe cache get

      - name: Reject proof placeholders and untrusted proof evaluation
        run: |
          if grep -RInE --include='*.lean' \
            '(^|[^A-Za-z_])(sorry|admit|native_decide)([^A-Za-z_]|$)|^[[:space:]]*axiom[[:space:]]' \
            Wikifunctions Wikifunctions.lean; then
            exit 1
          fi

      - name: Build every module
        run: lake build

      - name: Print public theorem axiom dependencies
        run: lake env lean Wikifunctions/Audit.lean
