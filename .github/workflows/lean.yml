name: Lean build

# Builds the ground-up model (Wikifunctions/Model/): the hand-written ZObject
# substrate and the generated Model.Types.* modules. Dependency-free (no Mathlib),
# so this is just elan + `lake build`.

on:
  push:
    branches: [main]
    paths:
      - 'Wikifunctions/**'
      - 'lakefile.toml'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'Wikifunctions/**'
      - 'lakefile.toml'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ hashFiles('lean-toolchain') }}

      - name: Build the model
        run: lake build
