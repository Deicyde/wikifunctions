name: Blueprint

# Builds the interactive HTML blueprint (plasTeX only — no Lean/LaTeX needed for
# the web version) and deploys it to GitHub Pages. Enable Pages -> "GitHub Actions"
# in the repository settings for the deploy step to publish.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deployments but never cancel one mid-flight: a cancelled deploy
# can leave the github-pages environment in a pending state, which is a common cause
# of the transient "Deployment failed, try again later." error on the next run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install a LaTeX distribution
        # plasTeX resolves the document class and packages via kpsewhich; without a
        # TeX install it silently fails to process \newtheorem and \newcommand, and
        # plastexdepgraph then crashes on unrecognized (unhashable) theorem nodes.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
      - name: Install blueprint tooling (pinned to the known-good set)
        run: pip install -r blueprint/requirements.txt
      - name: Verify blueprint declaration names
        run: python3 blueprint/check_decls.py
      - name: Build web blueprint
        run: cd blueprint/src && plastex -c plastex.cfg web.tex
      - name: Generate the declaration resolver (find/)
        # \lean{Decl} links point at {dochome}/find/#doc/Decl; this writes the
        # static resolver that redirects each declaration to its GitHub source.
        run: python3 blueprint/make_find.py blueprint/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: blueprint/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # Whichever attempt actually deployed provides the URL.
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      # actions/deploy-pages intermittently returns "Deployment failed, try again
      # later." even when the artifact is fine. Attempt once without failing the job,
      # then retry after a short wait; only a double failure surfaces as a red run
      # (and an email). This makes the common single flake self-heal.
      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait out the transient Pages error
        if: steps.deploy.outcome == 'failure'
        run: sleep 20
      - name: Deploy to GitHub Pages (retry)
        id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
