name: Live drift check

# Weekly: verify the formalization still tracks PRODUCTION. Fetches the deployed
# Z14K3 source from the live Wikifunctions API and (1) AST-diffs it against the
# vendored programs/*.py, then (2) re-runs the full round-trip — including the
# Lean-kernel certificate — against the live source. A red run means the deployed
# implementation drifted from what we transcribed and verified.

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Drift check (vendored vs deployed source)
        run: python3 roundtrip/fetch.py --check

      - name: Value-universe completeness (Val vs live Z8 signatures)
        run: python3 blueprint/check_value_universe.py

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lean toolchain and lake deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake
          key: lean-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Build the Mathlib-free Prog modules
        run: lake build Wikifunctions.Python.Z13701Prog Wikifunctions.Python.Z13667Prog

      - name: Round-trip against production source (P1/P2/P3)
        run: python3 roundtrip/test_roundtrip.py --live
